name: Build all firmwares

on:
  workflow_dispatch:

  push:
    branches:
      - dev
      - master

  pull_request:
    paths:
      - "src/**"
      - "html/**"
      - "test/**"
      - "platformio.ini"
      - "**/*.ini"
      - "**/*.py"
      - "**/*.csv"
      - ".forgejo/workflows/firmware-builds.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test_builds:
    name: Build ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        variant:
          # - ttgo_t8 # Derzeit deaktiviert
          # - lolin_d32_pro
          - lolin_d32_pro_sdmmc_pe
          # - complete

    steps:
      - name: Checkout ESPuino
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Setup Python 3.12
        uses: https://code.forgejo.org/actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: https://code.forgejo.org/actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache PlatformIO
        uses: https://code.forgejo.org/actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini', '**/*.ini', '**/lockfiles') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip setuptools platformio
          pio pkg update --global
          mkdir -p binaries

      - name: Build ${{ matrix.variant }} DE
        run: |
          sed -i -E 's/^[[:space:]]*#define LANGUAGE .*/\t#define LANGUAGE DE/' src/settings.h
          platformio run -e "${{ matrix.variant }}"

          cp ".pio/build/${{ matrix.variant }}/firmware.bin" \
             "binaries/firmware-DE.bin"

          cp ".pio/build/${{ matrix.variant }}/bootloader.bin" \
             "binaries/bootloader.bin"

          cp ".pio/build/${{ matrix.variant }}/partitions.bin" \
             "binaries/partitions.bin"

#      - name: Build ${{ matrix.variant }} EN
#        run: |
#          sed -i -E 's/^[[:space:]]*#define LANGUAGE .*/\t#define LANGUAGE EN/' src/settings.h
#          platformio run -e "${{ matrix.variant }}"
#
#          cp ".pio/build/${{ matrix.variant }}/firmware.bin" \
#             "binaries/firmware-EN.bin"

#      - name: Build ${{ matrix.variant }} FR
#        run: |
#          sed -i -E 's/^[[:space:]]*#define LANGUAGE .*/\t#define LANGUAGE FR/' src/settings.h
#          platformio run -e "${{ matrix.variant }}"

#          cp ".pio/build/${{ matrix.variant }}/firmware.bin" \
#             "binaries/firmware-FR.bin"

      - name: Upload firmware artifacts
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: ${{ matrix.variant }}
          path: binaries/
          if-no-files-found: error

  commit:
    name: Publish firmwares
    runs-on: ubuntu-latest
    needs:
      - test_builds

    if: >-
      forgejo.event_name != 'pull_request' &&
      (forgejo.ref_name == 'dev' || forgejo.ref_name == 'master')

    steps:
      - name: Checkout firmware repository
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          repository: ${{ forgejo.repository_owner }}/ESPuino-Firmware
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: target-repo
          persist-credentials: true

      - name: Create target directory
        run: |
          mkdir -p "target-repo/Firmwares/${{ forgejo.ref_name }}"

      - name: Download firmware artifacts
        uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          path: target-repo/Firmwares/${{ forgejo.ref_name }}

      - name: Commit and push firmware changes
        working-directory: target-repo
        run: |
          git config user.name "Forgejo Actions"
          git config user.email "actions@forgejo.local"

          git add "Firmwares/${{ forgejo.ref_name }}"

          if git diff --cached --quiet; then
            echo "Keine geänderten Firmware-Dateien."
            exit 0
          fi

          git commit -m "Firmware build from ${{ forgejo.repository }}@${{ forgejo.sha }}"
          git push