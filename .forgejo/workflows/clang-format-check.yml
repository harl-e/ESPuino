name: clang-format Check

on:
  push:
    paths:
      - "src/**"
      - ".clang-format"
      - ".forgejo/workflows/clang-format.yml"

  pull_request:
    paths:
      - "src/**"
      - ".clang-format"
      - ".forgejo/workflows/clang-format.yml"

  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  formatting-check:
    name: Formatting Check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Run clang-format style check
        uses: https://github.com/jidicula/clang-format-action@v4.18.0
        with:
          clang-format-version: "16"
          check-path: "src"
          fallback-style: "LLVM"